[project]
name = "cymbal-operations-agent"
version = "1.0.0"
description = "Cymbal Superstores operations coordinator agent: NL2SQL analytics, certified POS troubleshooting RAG, and real-time Bigtable auditing over MCP."
authors = [
    {name = "Cymbal Retail Data Platform Team"},
]
requires-python = ">=3.11,<3.14"

dependencies = [
    # ADK with the extras this agent actually needs:
    #   gcp              -> Vertex AI / Agent Engine integration
    #   otel-gcp         -> Cloud Trace export
    #   bigquery-analytics -> BigQueryAgentAnalyticsPlugin (Part 1 telemetry)
    "google-adk[gcp,otel-gcp,bigquery-analytics]>=2.8.0,<3.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "gcsfs>=2024.11.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-aiplatform[evaluation,agent-engines]>=1.156.0,<2.0.0",
    "protobuf>=6.31.1,<7.0.0",
    # Agent-specific data plane
    "google-cloud-bigquery>=3.45.0,<4.0.0",
    "google-cloud-bigtable>=2.44.0,<3.0.0",
    "mcp>=1.30.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.8.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0,<2.0.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "codespell>=2.2.0,<3.0.0",
]

# ---------------------------------------------------------------------------
# Build-time dependency resolution
#
# Agent Runtime builds the container inside the target GCP project, which cannot
# reach an internal / authenticated package index. Pinning the default index to
# public PyPI here guarantees `uv.lock` records public URLs regardless of the
# contributor's global uv configuration, so the remote build can resolve every
# dependency. Without this, locking on a corp workstation bakes internal
# `*.pkg.dev` index URLs into the lockfile and the deploy build fails.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C", "B", "UP", "RUF"]
ignore = ["E501", "C901", "B006"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.codespell]
skip = "./.venv,uv.lock,./artifacts,./build"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
